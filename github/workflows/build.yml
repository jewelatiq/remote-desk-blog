name: Rebuild site from posts.json

on:
  push:
    branches: [main]
    paths:
      - posts.json
      - build.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run build.py
        run: python3 build.py

      - name: Commit regenerated site files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html about.html disclosure.html sitemap.xml robots.txt posts/
          git diff --quiet --cached || git commit -m "Auto-build site from posts.json [skip ci]"
          git push

